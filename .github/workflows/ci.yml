name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  go-test:
    name: go test (unit, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath -o /dev/null ./cmd/app

  go-integration:
    name: go test (integration, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: rifa
          POSTGRES_PASSWORD: rifa
          POSTGRES_DB: rifa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rifa -d rifa"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://rifa:rifa@localhost:5432/rifa?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags=integration -race ./...

  mailtrap:
    name: email delivery (Mailtrap sandbox)
    # Runs only when the owner has set the Mailtrap secrets; serial to respect the sandbox rate limit.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
      MAILTRAP_SANDBOX_ID: ${{ secrets.MAILTRAP_SANDBOX_ID }}
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: "2525"
      SMTP_USERNAME: ${{ secrets.MAILTRAP_SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.MAILTRAP_SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.MAILTRAP_API_TOKEN != ''
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.MAILTRAP_API_TOKEN != ''
        with:
          go-version-file: go.mod
      - run: go test -v -tags=mailtrap -p 1 -run Mailtrap ./tests/
        if: env.MAILTRAP_API_TOKEN != ''

  abacatepay:
    name: PIX sandbox (AbacatePay dev mode)
    # Runs only when the owner has set the AbacatePay dev-mode secrets.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
      ABACATEPAY_WEBHOOK_SECRET: ${{ secrets.ABACATEPAY_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.ABACATEPAY_API_KEY != ''
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.ABACATEPAY_API_KEY != ''
        with:
          go-version-file: go.mod
      - run: go test -v -tags=abacatepay -p 1 -run AbacatePaySandbox ./...
        if: env.ABACATEPAY_API_KEY != ''

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...

  frontend:
    name: frontend (biome, typecheck, build, markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      # GHSA-vfj7-8cjw-p6xm: braces (dev-only, via markdownlint-cli2 globs we control); no patched release exists.
      - run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run lint:md

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  e2e:
    name: e2e + smoke + DAST (docker compose)
    needs: [go-test, frontend]
    runs-on: ubuntu-latest
    env:
      # Throwaway admin for the axe scan of /admin/payouts (seeders/e2e_admin.go); CI-only stack.
      E2E_ADMIN_EMAIL: admin@e2e.test
      E2E_ADMIN_PASSWORD: e2e-admin-password-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Start stack
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env
          docker compose up -d --build --wait
          # Demo drawn raffle (e2e/draw.spec.ts) and the e2e admin (e2e/a11y.spec.ts).
          docker compose exec -T -e E2E_ADMIN_EMAIL -e E2E_ADMIN_PASSWORD app /app/rifa db:seed
      - name: Smoke
        run: |
          curl -fsS http://localhost:3000/up
          curl -fsS "http://localhost:3000/up?checks=1"
          curl -fsS http://localhost:3000/ | grep -q 'data-page="app"'
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          # -I: warnings do not fail; promote rules to FAIL in .zap/rules.tsv.
          cmd_options: "-I"
          fail_action: true
      - name: Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          target: http://localhost:3000
          flags: "-severity medium,high,critical -exclude-tags dos,fuzz,intrusive"
      - name: App logs
        if: always()
        run: docker compose logs app
